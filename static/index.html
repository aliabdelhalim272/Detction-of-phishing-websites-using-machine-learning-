<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing URL Detector</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input[type="text"] { width: 80%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; font-weight: bold; border-radius: 4px; }
        .safe { background-color: #d4edda; color: #155724; }
        .danger { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Phishing Detection System</h2>
        <input type="text" id="urlInput" placeholder="Enter URL here (e.g., https://example.com)">
        <br>
        <button onclick="checkURL()">Scan URL</button>
        <div id="resultBox" class="result" style="display:none;"></div>
    </div>

    <script>
        async function checkURL() {
            const url = document.getElementById('urlInput').value;
            const resultBox = document.getElementById('resultBox');
            if(!url) return alert("Please enter a URL first!");

            resultBox.style.display = 'block';
            resultBox.className = 'result';
            resultBox.innerText = 'Scanning...';

            try {
                const response = await fetch('/api/v1/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const data = await response.json();

                if (response.ok) {
                    if (data.is_phishing) {
                        resultBox.className = 'result danger';
                        resultBox.innerText = `⚠️ Warning: Phishing detected! Confidence: ${data.confidence_score}%`;
                    } else {
                        resultBox.className = 'result safe';
                        resultBox.innerText = `✅ URL is safe (Legitimate). Confidence: ${data.confidence_score}%`;
                    }
                } else {
                    resultBox.innerText = 'Error: ' + data.detail;
                }
            } catch (err) {
                resultBox.innerText = 'Failed to connect to the server.';
            }
        }
    </script>
</body>
</html>
